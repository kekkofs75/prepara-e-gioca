  <!-- ════════════════════════════════════════════════════════ -->
  <!-- BOTTOM NAVIGATION  →  Home | Cerca | Indietro           -->
  <!-- ════════════════════════════════════════════════════════ -->
  <nav id="bottom-nav">
    <button class="nav-btn active" id="nav-home" aria-label="Home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z"/>
        <polyline points="9,21 9,13 15,13 15,21"/>
      </svg>
      Home
    </button>

    <!-- Cerca — visibile solo sulla home, si attiva/disattiva -->
    <button class="nav-btn" id="nav-search" aria-label="Cerca">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      Cerca
    </button>

    <button class="nav-btn" id="nav-back" aria-label="Indietro">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15,18 9,12 15,6"/>
      </svg>
      Indietro
    </button>
  </nav>

  <!-- iOS install hint -->
  <div id="install-banner">
    <button id="install-close" aria-label="Chiudi">✕</button>
    <strong>📲 Installa l'app!</strong>
    Tocca <strong>Condividi</strong> poi <strong>Aggiungi a schermata Home</strong>.
  </div>

  <!-- markdown-it + plugin attrs (classi CSS su qualsiasi elemento markdown) -->
  <!-- I blocchi ::: sono gestiti dal preprocessore JS interno -->
  <script src="https://cdn.jsdelivr.net/npm/markdown-it@14/dist/markdown-it.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/markdown-it-attrs@4/markdown-it-attrs.browser.js"></script>

  <script>
  "use strict";

  /* ── Sezioni ────────────────────────────────────────────── */
  const SECTIONS = [
    { id: 'preparazione', label: 'Preparazione',         icon: 'icons/checklist.png',      file: 'preparazione.md' },
    { id: 'obiettivo',    label: 'Obiettivo',             icon: 'icons/dice-target.png',    file: 'obiettivo.md'    },
    { id: 'svolgimento',  label: 'Svolgimento del Gioco', icon: 'icons/pawn-clockwise.png', file: 'svolgimento.md'  },
    { id: 'finepartita',  label: 'Fine della Partita',    icon: 'icons/laurels-trophy.png', file: 'finepartita.md'  },
    { id: 'panoramica',   label: 'Panoramica',            icon: 'icons/stack.png',          file: 'panoramica.md'   },
  ];

  /* ── State ──────────────────────────────────────────────── */
  let gamesData   = [];
  let ownerFilter = 'all';   // 'all' | 'mine' | 'others'
  let currentGame = null;
  let navHistory  = ['home'];
  let searchOpen  = false;

  /* ── DOM refs ───────────────────────────────────────────── */
  const $ = id => document.getElementById(id);
  const views = {
    home:         $('view-home'),
    gameMenu:     $('view-game-menu'),
    section:      $('view-section'),
    factionsList: $('view-factions-list'),
    aid:          $('view-aid'),
  };

  /* ── markdown-it + markdown-it-attrs ────────────────────────
     markdown-it-attrs: aggiunge classi CSS a qualsiasi elemento
       es. **testo**{.accent}   ![](img.png){.img-center}
     I blocchi ::: indent / ::: accent sono gestiti dal
     preprocessore JS (nessun plugin CDN necessario).
  ══════════════════════════════════════════════════════════ */
  let mdParser;
  try {
    mdParser = markdownit({ breaks: true, html: true, linkify: false });
    if (typeof markdownItAttrs !== 'undefined') {
      mdParser.use(markdownItAttrs);
    }
  } catch(e) {
    console.warn('[MD] Errore init markdown-it:', e);
    mdParser = { render: text => text.replace(/\n\n/g, '<br><br>') };
  }

  /* ── History per tasto back hardware ───────────────────── */
  history.replaceState({ pg: 'home' }, '');
  function pushNav(viewName) {
    history.pushState({ pg: viewName }, '');
  }

  /* ── View router ────────────────────────────────────────── */
  function showView(name) {
    Object.values(views).forEach(v => v.classList.remove('active'));
    views[name].classList.add('active');

    $('nav-home').classList.toggle('active', name === 'home');
    $('nav-back').classList.remove('active');

    // Il tasto Cerca è visibile su tutte le view
    $('nav-search').classList.remove('hidden');

    // Chiudi la ricerca se si cambia vista
    if (searchOpen && name !== 'home') closeSearch();

    views[name].scrollTop = 0;
    window.scrollTo(0, 0);
    setTimeout(updateScrollBtn, 50);
  }

  /* ── Theme ──────────────────────────────────────────────── */
  function setGameTheme(hex) {
    const root = document.documentElement;
    root.style.setProperty('--game-color', hex);
    const r = parseInt(hex.slice(1,3), 16);
    const g = parseInt(hex.slice(3,5), 16);
    const b = parseInt(hex.slice(5,7), 16);
    root.style.setProperty('--game-color-mid',
      `rgb(${Math.max(0,r-25)},${Math.max(0,g-25)},${Math.max(0,b-25)})`);
    root.style.setProperty('--game-color-pale',
      `color-mix(in srgb, ${hex} 12%, white)`);
    $('meta-theme-color').setAttribute('content', hex);
  }

  function resetTheme() {
    ['--game-color', '--game-color-mid', '--game-color-pale']
      .forEach(p => document.documentElement.style.removeProperty(p));
    $('meta-theme-color').setAttribute('content', '#EE8860');
  }

  /* ── Init ───────────────────────────────────────────────── */
  async function init() {
    try {
      const res = await fetch('./games.json');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      gamesData = (data.games || [])
        .filter(g => !g.hidden)              // escludi giochi nascosti
        .sort((a,b) => a.title.localeCompare(b.title, 'it'));
      renderHomeList(gamesData);
    } catch(e) {
      $('games-list').innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">⚠️</div>
          <p>Impossibile caricare i giochi.<br>Controlla la connessione.</p>
        </div>`;
      $('games-count').textContent = '';
    }
  }

  /* ── Score formatter: sempre 1 decimale (es. 8.0, 8.1) ──── */
  const fmtScore = v => (v == null) ? '—' : parseFloat(v).toFixed(1);

  /* ── SVG icone ──────────────────────────────────────────── */
  const metaSVG = {
    rank:    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89L17 22l-5-3-5 3 1.523-9.11"/></svg>`,
    score:   `<svg viewBox="0 0 24 24" fill="currentColor"><polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/></svg>`,
    time:    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>`,
    players: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>`,
  };

  /* ── Render home ────────────────────────────────────────── */
  function renderHomeList(games) {
    const count = $('games-count');
    const list  = $('games-list');

    // Applica filtro ownership (owned assente = true di default)
    const filtered = games.filter(g => {
      const owned = g.owned !== false;
      if (ownerFilter === 'mine')   return owned;
      if (ownerFilter === 'others') return !owned;
      return true;
    });

    if (!filtered.length) {
      count.textContent = '';
      list.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">🔍</div>
          <p>Nessun gioco trovato.</p>
        </div>`;
      return;
    }
    count.textContent = `${filtered.length} gioch${filtered.length === 1 ? 'o' : 'i'}`;
    list.innerHTML = filtered.map(g => {
      const coverSrc  = g.cover     || (g.folder + '/img/cover.png');
      const bigSrc    = g.coverBig  || (g.folder + '/img/cover-big.png');
      const bgColor   = g.themeColor || 'var(--surface-2)';
      const safeTitle = g.title.replace(/'/g, "\\'");
      const notOwned  = g.owned === false ? ' not-owned' : '';
      return `
      <div class="game-card${notOwned}" onclick="openGame('${g.id}')" role="button" tabindex="0">
        <div class="game-card-img-wrap" style="background:${bgColor}; position:relative;"
             onclick="event.stopPropagation(); openLightbox('${bigSrc}','${safeTitle}')">
          <img src="${coverSrc}"
               alt="${g.title}" loading="lazy"
               onerror="this.parentElement.innerHTML='🎲'">
          ${g.aiSummary ? '<span class="ai-badge">✨ IA</span>' : ''}
        </div>
        <div class="game-card-body">
          <div class="game-card-title">${g.title}</div>
          <div class="game-meta">
            <div class="meta-pill">${metaSVG.rank}   <span>#${g.bggRank  ?? '—'} BGG</span></div>
            <div class="meta-pill">${metaSVG.score}  <span>${fmtScore(g.bggScore)}/10</span></div>
            <div class="meta-pill">${metaSVG.time}   <span>${g.duration ?? '—'} min</span></div>
            <div class="meta-pill">${metaSVG.players}<span>${g.players  ?? '—'} gioc.</span></div>
          </div>
        </div>
        <div class="game-card-arrow">›</div>
      </div>
    `}).join('');
  }

  /* ── Open Game Menu ─────────────────────────────────────── */
  function openGame(gameId) {
    const game = gamesData.find(g => g.id === gameId);
    if (!game) return;
    currentGame = game;
    navHistory.push('gameMenu');
    pushNav('gameMenu');                    // ← back hardware
    setGameTheme(game.themeColor || '#EE8860');

    const ci = $('game-copertina');
    const cw = $('copertina-wrap');
    ci.src = game.copertina || (game.folder + '/img/copertina.png');
    ci.style.display = 'block';
    cw.style.background = game.themeColor || '#EE8860';
    ci.onerror = () => { ci.style.display = 'none'; };

    $('game-menu-title').textContent = game.title;

    const aiBadgeHtml = game.aiSummary
      ? '<span class="ai-badge-title">✨ riassunto IA</span>'
      : (game.revision
          ? `<span class="ai-badge-title">${game.revision}</span>`
          : '');
    $('sections-label-wrap').innerHTML = `Sezioni del Regolamento${aiBadgeHtml ? ' ' + aiBadgeHtml : ''}`;

    $('game-meta-strip').innerHTML = [
      game.bggRank  ? `<div class="meta-chip">${metaSVG.rank}    #${game.bggRank} BGG</div>`   : '',
      game.bggScore ? `<div class="meta-chip">${metaSVG.score}   ${fmtScore(game.bggScore)}/10</div>`     : '',
      game.duration ? `<div class="meta-chip">${metaSVG.time}    ${game.duration} min</div>`    : '',
      game.players  ? `<div class="meta-chip">${metaSVG.players} ${game.players} gioc.</div>`   : '',
    ].join('');

    $('sections-list').innerHTML = SECTIONS.map(s => `
      <button class="section-btn" onclick="openSection('${s.id}')">
        <span class="btn-icon"><img src="${s.icon}" alt="${s.label}"></span>
        <span class="btn-label">${s.label}</span>
        <span class="btn-arrow">›</span>
      </button>
    `).join('');

    // Fazioni — pulsante singolo di navigazione (solo se il gioco le ha)
    const factions = game.factions || [];
    const fblock   = $('factions-menu-block');
    fblock.style.display = factions.length ? 'block' : 'none';

    // Aiuto al Giocatore — pulsante solo se il gioco ha tab aid
    const aidTabs = game.aid || [];
    $('aid-menu-block').style.display = aidTabs.length ? 'block' : 'none';

    showView('gameMenu');
  }

  /* ── Open Section ───────────────────────────────────────── */
  async function openSection(sectionId) {
    const sec = SECTIONS.find(s => s.id === sectionId);
    if (!sec || !currentGame) return;
    navHistory.push('section');
    pushNav('section');                     // ← back hardware

    $('section-hero-game').textContent  = currentGame.title;
    $('section-hero-title').textContent = sec.label;
    $('section-hero-icon').innerHTML    = `<img src="${sec.icon}" alt="${sec.label}">`;

    $('markdown-content').innerHTML = `
      <div class="loading-state">
        <div class="spinner"></div>
        <p>Caricamento…</p>
      </div>`;

    showView('section');

    try {
      const res = await fetch(`${currentGame.folder}/${sec.file}`);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      let md = await res.text();

      // Preprocessa: glossario, blocchi :::, rebase URL → poi rendering con markdown-it
      glossaryMap = {};
      clearHighlights();
      const imgBase = currentGame.folder + '/img/';
      md = preprocessMarkdown(md, imgBase);

      $('markdown-content').innerHTML = mdParser.render(md);
      // Reset scroll dopo inserimento asincrono del contenuto
      window.scrollTo(0, 0);
      document.documentElement.scrollTop = 0;
      document.body.scrollTop = 0;
      setTimeout(updateScrollBtn, 50);
    } catch(e) {
      $('markdown-content').innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">📄</div>
          <p>Contenuto non ancora disponibile.<br>Aggiungi il file <code>${sec.file}</code>.</p>
        </div>`;
    }
  }

  /* ── Open Factions List ─────────────────────────────────── */
  function openFactionsList() {
    if (!currentGame) return;
    const factions = currentGame.factions || [];
    navHistory.push('factionsList');
    pushNav('factionsList');

    $('factions-hero-game').textContent  = currentGame.title;
    $('factions-hero-title').textContent = 'Fazioni';
    $('factions-hero-icon').innerHTML =
      `<img src="icons/factions.png" style="width:28px;height:28px;filter:invert(1);opacity:0.75;" alt="">`;

    $('factions-list').innerHTML = factions.map(f => {
      const rawIcon   = f.icon || null;
      const borderColor = f.color || 'var(--game-color)';
      // Supporta sia path relativo ("factions/img/x.png") che completo ("games/root-ia/factions/img/x.png")
      const iconPath = rawIcon
        ? (rawIcon.startsWith('http') || rawIcon.startsWith('/') || rawIcon.startsWith('games/')
            ? rawIcon
            : `${currentGame.folder}/${rawIcon}`)
        : null;
      const imgHtml = iconPath
        ? `<img class="faction-btn-img" src="${iconPath}" alt="" data-fallback="1">`
        : `<div class="faction-btn-icon-fallback"><span style="-webkit-mask-image:url(icons/factions.png);mask-image:url(icons/factions.png)"></span></div>`;
      return `
      <button class="faction-btn" onclick="openFaction('${f.id}')"
              style="border-color:${borderColor}; color:${borderColor}">
        ${imgHtml}
        <span class="faction-btn-label">${f.label || f.id}</span>
        <span class="faction-btn-arrow" style="color:${borderColor}">›</span>
      </button>`;
    }).join('');

    showView('factionsList');

    // Error handler per immagini fazione — mostra icona fallback se non carica
    $('factions-list').querySelectorAll('img[data-fallback]').forEach(img => {
      img.addEventListener('error', function() {
        const fb = document.createElement('div');
        fb.className = 'faction-btn-icon-fallback';
        fb.innerHTML = '<span style="-webkit-mask-image:url(icons/factions.png);mask-image:url(icons/factions.png)"></span>';
        this.parentNode.replaceChild(fb, this);
      });
    });
  }

  /* ── Open Faction ───────────────────────────────────────── */
  async function openFaction(factionId) {
    if (!currentGame) return;
    const faction = (currentGame.factions || []).find(f => f.id === factionId);
    if (!faction) return;
    navHistory.push('section');
    pushNav('section');

    // Applica il colore fazione se specificato, altrimenti usa quello del gioco
    const factionColor = faction.color || currentGame.themeColor || '#EE8860';
    setGameTheme(factionColor);

    // Hero
    const iconPath = faction.icon ? `${currentGame.folder}/${faction.icon}` : null;
    $('section-hero-game').textContent  = currentGame.title;
    $('section-hero-title').textContent = faction.label || faction.id;
    $('section-hero-icon').innerHTML    = iconPath
      ? `<img src="${iconPath}" alt="${faction.label || ''}"
              style="border-radius:var(--radius-sm);object-fit:cover;width:32px;height:32px;">`
      : `<span style="display:inline-block;width:28px;height:28px;
             background-color:var(--game-color);
             -webkit-mask-image:url(icons/factions.png);
             mask-image:url(icons/factions.png);
             mask-size:contain;mask-repeat:no-repeat;mask-position:center;"></span>`;

    $('markdown-content').innerHTML = `
      <div class="loading-state">
        <div class="spinner"></div>
        <p>Caricamento…</p>
      </div>`;

    showView('section');

    const filePath = `${currentGame.folder}/factions/${factionId}.md`;
    try {
      const res = await fetch(filePath);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      let md = await res.text();
      glossaryMap = {};
      clearHighlights();
      const imgBase = `${currentGame.folder}/factions/img/`;
      md = preprocessMarkdown(md, imgBase);
      $('markdown-content').innerHTML = mdParser.render(md);
      window.scrollTo(0, 0);
      document.documentElement.scrollTop = 0;
      document.body.scrollTop = 0;
      setTimeout(updateScrollBtn, 50);
    } catch(e) {
      $('markdown-content').innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">🎭</div>
          <p>Contenuto non ancora disponibile.<br>
             Aggiungi il file <code>factions/${factionId}.md</code>.</p>
        </div>`;
    }
  }

  /* ── Aiuto al Giocatore ─────────────────────────────────── */
  const AID_ORDER = ['preparazione', 'turno', 'riferimento'];
  const AID_LABELS = { preparazione: 'Preparazione', turno: 'Turno', riferimento: 'Riferimento' };
  let aidTabs     = [];   // tab disponibili in ordine fisso
  let aidTabIdx   = 0;    // indice corrente
  let aidContents = {};   // cache: { id: html }
  let aidTouchX   = 0;

  async function openAid() {
    if (!currentGame) return;
    const gameTabs = currentGame.aid || [];
    // Mantieni ordine fisso: prep → turno → rif
    aidTabs = AID_ORDER.filter(id => gameTabs.includes(id));
    if (!aidTabs.length) return;

    navHistory.push('aid');
    pushNav('aid');

    $('aid-hero-game').textContent  = currentGame.title;
    $('aid-hero-title').textContent = 'Aiuto al Giocatore';
    $('aid-hero-icon').innerHTML    =
      `<img src="icons/aid.png" style="width:28px;height:28px;filter:invert(1);opacity:0.75;" alt="">`;

    // Costruisce tab bar
    $('aid-tab-bar').innerHTML = aidTabs.map((id, i) => `
      <button class="aid-tab${id === 'turno' ? ' active' : ''}"
              id="aid-tab-${id}" onclick="switchAidTab(${i})">
        ${AID_LABELS[id]}
      </button>`).join('');

    // Costruisce pannelli (placeholder durante il caricamento)
    const panelW = 100 / aidTabs.length;
    $('aid-panels').style.width = `${aidTabs.length * 100}%`;
    $('aid-panels').innerHTML = aidTabs.map(id => `
      <div class="aid-panel" id="aid-panel-${id}"
           style="width:${panelW}%">
        <div class="loading-state">
          <div class="spinner"></div>
          <p>Caricamento…</p>
        </div>
      </div>`).join('');

    // Default: mostra Turno
    aidTabIdx = aidTabs.includes('turno') ? aidTabs.indexOf('turno') : 0;
    _aidMoveTo(aidTabIdx, false);

    showView('aid');

    // Carica tutti i tab in parallelo
    aidContents = {};
    const imgBase = `${currentGame.folder}/aid/img/`;
    await Promise.all(aidTabs.map(async id => {
      try {
        const res = await fetch(`${currentGame.folder}/aid/${id}.md`);
        if (!res.ok) throw new Error();
        let md = await res.text();
        md = preprocessMarkdown(md, imgBase);
        aidContents[id] = mdParser.render(md);
      } catch {
        aidContents[id] = `<div class="empty-state">
          <div class="empty-icon">📋</div>
          <p>Aggiungi il file <code>aid/${id}.md</code>.</p>
        </div>`;
      }
      const panel = $(`aid-panel-${id}`);
      if (panel) panel.innerHTML = `<div class="md-body">${aidContents[id]}</div>`;
    }));
  }

  function switchAidTab(idx) {
    if (idx < 0 || idx >= aidTabs.length) return;
    aidTabIdx = idx;
    aidTabs.forEach((id, i) =>
      $(`aid-tab-${id}`)?.classList.toggle('active', i === idx)
    );
    _aidMoveTo(idx, true);
  }

  function _aidMoveTo(idx, animate) {
    const panels = $('aid-panels');
    if (!animate) panels.style.transition = 'none';
    const pct = 100 / aidTabs.length;
    panels.style.transform = `translateX(-${idx * pct}%)`;
    if (!animate) requestAnimationFrame(() => {
      panels.style.transition = '';
    });
  }

  // Swipe touch handlers
  $('aid-panels').addEventListener('touchstart', e => {
    aidTouchX = e.touches[0].clientX;
  }, { passive: true });

  $('aid-panels').addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - aidTouchX;
    if (Math.abs(dx) > 50) {
      if (dx < 0) switchAidTab(aidTabIdx + 1);
      else        switchAidTab(aidTabIdx - 1);
    }
  }, { passive: true });

  /* ── Title Case ─────────────────────────────────────────── */
  function titleCase(str) {
    return str.replace(/\w\S*/g, w => w.charAt(0).toUpperCase() + w.slice(1));
  }

  /* ── Popup Definizione ──────────────────────────────────── */
  function openDefPopup(key) {
    const entry = glossaryMap[key];
    if (!entry) return;

    $('def-popup-term').textContent = titleCase(entry.term);

    // Renderizza il markdown della definizione senza toccare glossaryMap
    const imgBase = currentGame ? (currentGame.folder + '/img/') : '';
    const defMd   = rebaseImages(entry.def, imgBase);
    $('def-popup-content').innerHTML = mdParser.render(defMd);

    $('def-popup').classList.add('open');
    history.pushState({ pg: 'defpopup' }, '');
  }

  function closeDefPopup() {
    $('def-popup').classList.remove('open');
    $('def-popup-content').innerHTML = '';
  }

  $('def-popup-backdrop').addEventListener('click', closeDefPopup);
  $('def-popup-close').addEventListener('click', closeDefPopup);

  // Delegazione eventi: click su qualsiasi .def dentro il contenuto markdown
  function handleMarkdownClick(e) {
    // Popup definizione
    const defEl = e.target.closest('.def');
    if (defEl) {
      const key = defEl.dataset.def;
      if (key) openDefPopup(key);
      return;
    }
    // Lightbox immagini
    const imgEl  = e.target.closest('img');
    const wrapEl = e.target.closest('.img-lg-wrap');
    const target = imgEl || (wrapEl ? wrapEl.querySelector('img') : null);
    if (target && !target.classList.contains('img-icon')) {
      const alt   = target.alt || '';
      const title = alt ? titleCase(alt) : '';
      openLightbox(target.src, title);
      return;
    }
  }

  $('markdown-content').addEventListener('click', handleMarkdownClick);
  $('aid-panels').addEventListener('click', handleMarkdownClick);

  /* ── Lightbox ───────────────────────────────────────────── */
  function openLightbox(src, caption) {
    const lb  = $('lightbox');
    const img = $('lightbox-img');
    img.src = src;
    img.alt = caption || '';
    $('lightbox-caption').textContent = caption || '';
    lb.classList.add('open');
    history.pushState({ pg: 'lightbox' }, '');
  }

  function closeLightbox() {
    $('lightbox').classList.remove('open');
    $('lightbox-img').src = '';
    $('lightbox-caption').textContent = '';
  }

  $('lightbox').addEventListener('click', function(e) {
    if (e.target === this) closeLightbox();
  });
  $('lightbox-close').addEventListener('click', closeLightbox);

  // Chiude il lightbox anche col tasto back hardware
  window.addEventListener('popstate', function () {
    if ($('def-popup').classList.contains('open')) {
      closeDefPopup();
      return;
    }
    if ($('lightbox').classList.contains('open')) {
      closeLightbox();
      return;
    }
    if (searchOpen) {
      closeSearch();
      history.pushState({ pg: navHistory[navHistory.length - 1] }, '');
      return;
    }
    if (navHistory.length > 1) {
      goBack();
      history.pushState({ pg: navHistory[navHistory.length - 1] }, '');
    }
  });

  /* ── Preprocessore Markdown ─────────────────────────────────
     Eseguito sul testo raw PRIMA di markdown-it.
     1. Converte blocchi ::: tipo ... ::: in <div class="md-tipo">
        (markdown-it-container non disponibile come UMD browser)
     2. Rebasa URL immagini relative → cartella img/ del gioco
  ══════════════════════════════════════════════════════════ */
  /* ── Mappa del glossario (per sezione corrente) ─────────── */
  let glossaryMap = {};

  /* ── Parser del blocco glossario ────────────────────────── */
  function parseGlossaryContent(content) {
    // Divide sulle righe che iniziano con [ — ogni entry è [termine]: def
    const entries = content.split(/\n(?=\[)/);
    entries.forEach(entry => {
      const m = entry.match(/^\[([^\]]+)\]:\s*([\s\S]+?)(?:\n*$)/);
      if (m) {
        const term = m[1].trim();
        const def  = m[2].trim();
        if (term && def) glossaryMap[term.toLowerCase()] = { term, def };
      }
    });
  }

  /* ── Rebase immagini (senza toccare glossaryMap) ─────────── */
  function rebaseImages(md, imgBase) {
    return md.replace(
      /!\[([^\]]*)\]\((?!https?:\/\/|\/|data:)([^)]+)\)/g,
      (_, alt, rest) => {
        const m = rest.match(/^([^\s"'{}]+)(.*)/);
        if (!m) return _;
        let [, src, tail] = m;
        src = imgBase + src.replace(/^\.?\/?img\//, '');
        return `![${alt}](${src}${tail})`;
      }
    );
  }

  /* ── Preprocessore Markdown ─────────────────────────────────
     Ordine operazioni:
     1. Estrae :::glossary e popola glossaryMap (poi lo elimina)
     2. Converte :::tipo ... ::: in <div class="md-tipo">
     3. Sostituisce [termine]{.def} con <span class="def" data-def="...">
     4. Rebasa URL immagini relative → img/ del gioco
     FIX: usa \s* invece di [ \t]+ — funziona sia con che senza spazio
          (:::glossary e ::: glossary entrambi validi)
  ══════════════════════════════════════════════════════════ */
  function preprocessMarkdown(md, imgBase) {
    glossaryMap = {};

    // 0. ![nome]{.icon} → span.img-icon con mask-image
    md = md.replace(
      /!\[([^\]]*)\]\{\.icon\}/g,
      (_, name) => {
        const iconName = name.trim().toLowerCase().replace(/\s+/g, '-');
        const url = `icons/${iconName}.png`;
        return `<span class="img-icon" style="-webkit-mask-image:url(${url});mask-image:url(${url})" role="img" aria-label="${name}"></span>`;
      }
    );

    // 0b. ![alt](url){.img-inline-lg} → <span class="img-lg-wrap"><img ...></span>
    //     Rebasa subito l'URL (il rebase generale in step 4 non vede più la sintassi md)
    md = md.replace(
      /!\[([^\]]*)\]\((?!https?:\/\/|\/|data:)([^)]+)\)\{\.img-inline-lg\}/g,
      (_, alt, src) => {
        const cleanSrc = imgBase + src.replace(/^\.?\/?img\//, '');
        return `<span class="img-lg-wrap"><img src="${cleanSrc}" alt="${alt}"></span>`;
      }
    );
    // URL assoluti (https, /, data:)
    md = md.replace(
      /!\[([^\]]*)\]\((https?:\/\/[^)]+|\/[^)]+|data:[^)]+)\)\{\.img-inline-lg\}/g,
      (_, alt, src) => `<span class="img-lg-wrap"><img src="${src}" alt="${alt}"></span>`
    );

    // 1a. :::spoiler Titolo → <details> con contenuto già renderizzato
    //     Va prima del blocco generico ::: per non essere catturato da esso
    md = md.replace(
      /^:::\s*spoiler\s+(.+?)\s*\r?\n([\s\S]*?)^:::\s*$/gm,
      (_, title, content) => {
        // Renderizza il contenuto interno come markdown completo
        const innerMd   = preprocessMarkdown(content.trim(), imgBase);
        const innerHtml = mdParser.render(innerMd);
        return `<details class="md-spoiler">\n<summary class="md-spoiler-summary">${title.trim()}</summary>\n<div class="md-spoiler-body">${innerHtml}</div>\n</details>\n\n`;
      }
    );

    // 1b. Blocchi :::tipo → <div class="md-tipo">  (generico)
    md = md.replace(
      /^:::\s*glossary\s*\r?\n([\s\S]*?)^:::\s*$/gm,
      (_, contenuto) => {
        parseGlossaryContent(contenuto);
        return '';
      }
    );

    // 2. Blocchi :::tipo → <div class="md-tipo">
    md = md.replace(
      /^:::\s*(\S+)\s*\r?\n([\s\S]*?)^:::\s*$/gm,
      (_, tipo, contenuto) => `<div class="md-${tipo}">\n\n${contenuto}\n</div>\n`
    );

    // 3. [termine]{.def} → <span class="def" data-def="chiave">termine</span>
    md = md.replace(
      /\[([^\]]+)\]\{\.def\}/g,
      (_, term) => {
        const key = term.toLowerCase();
        return `<span class="def" data-def="${key.replace(/"/g,'&quot;')}">${term}</span>`;
      }
    );

    // 4. Rebase URL immagini relative
    md = rebaseImages(md, imgBase);

    return md;
  }

  /* ── Back navigation ────────────────────────────────────── */
  function goBack() {
    if (navHistory.length <= 1) return;
    navHistory.pop();
    const dest = navHistory[navHistory.length - 1];
    if (dest === 'home') {
      currentGame = null;
      resetTheme();
      showView('home');
    } else if (dest === 'gameMenu') {
      // Ripristina il colore del gioco (potrebbe essere stato cambiato da una fazione)
      if (currentGame) setGameTheme(currentGame.themeColor || '#EE8860');
      showView('gameMenu');
    } else if (dest === 'aid') {
      showView('aid');
    } else if (dest === 'factionsList') {
      // Ripristina il colore del gioco quando si torna alla lista fazioni
      if (currentGame) setGameTheme(currentGame.themeColor || '#EE8860');
      showView('factionsList');
    }
  }

  /* ══════════════════════════════════════════════════════════
     SEARCH — context-aware: filtra home o cerca in-pagina nelle sezioni
  ══════════════════════════════════════════════════════════ */

  /* ── In-page search state ───────────────────────────────── */
  let searchHits    = [];   // array di <mark> elements
  let searchHitIdx  = -1;   // indice corrente

  function isInSection() {
    return navHistory[navHistory.length - 1] === 'section';
  }

  /* ── Evidenzia occorrenze nel contenuto markdown ─────────── */
  function highlightInPage(query) {
    clearHighlights();
    if (!query) {
      updateSearchCounter();
      return;
    }

    const container = $('markdown-content');
    // Cammina i nodi di testo, evita elementi già marcati
    const walker = document.createTreeWalker(
      container,
      NodeFilter.SHOW_TEXT,
      { acceptNode: n => n.parentElement.closest('mark, .def, .search-nav-btn') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT }
    );

    const regex  = new RegExp(query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
    const nodes  = [];
    let   node;
    while ((node = walker.nextNode())) nodes.push(node);

    nodes.forEach(node => {
      const text = node.textContent;
      if (!regex.test(text)) return;
      regex.lastIndex = 0;

      const frag = document.createDocumentFragment();
      let last = 0, m;
      while ((m = regex.exec(text)) !== null) {
        if (m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
        const mark = document.createElement('mark');
        mark.className = 'search-hit';
        mark.textContent = m[0];
        frag.appendChild(mark);
        searchHits.push(mark);
        last = regex.lastIndex;
      }
      if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
      node.parentNode.replaceChild(frag, node);
    });

    searchHitIdx = searchHits.length > 0 ? 0 : -1;
    scrollToHit();
    updateSearchCounter();
  }

  function clearHighlights() {
    searchHits.forEach(mark => {
      const parent = mark.parentNode;
      if (!parent) return;
      parent.replaceChild(document.createTextNode(mark.textContent), mark);
      parent.normalize();
    });
    searchHits   = [];
    searchHitIdx = -1;
  }

  function scrollToHit() {
    searchHits.forEach((m, i) => m.classList.toggle('current', i === searchHitIdx));
    if (searchHitIdx >= 0 && searchHits[searchHitIdx]) {
      searchHits[searchHitIdx].scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }

  function updateSearchCounter() {
    const ctrl = $('search-controls');
    if (!isInSection()) { ctrl.classList.remove('visible'); return; }
    ctrl.classList.toggle('visible', true);
    const total = searchHits.length;
    $('search-counter').textContent = total === 0 ? '0/0'
      : `${searchHitIdx + 1}/${total}`;
  }

  function searchNext() { if (!searchHits.length) return; searchHitIdx = (searchHitIdx + 1) % searchHits.length; scrollToHit(); updateSearchCounter(); }
  function searchPrev() { if (!searchHits.length) return; searchHitIdx = (searchHitIdx - 1 + searchHits.length) % searchHits.length; scrollToHit(); updateSearchCounter(); }

  /* ── Open / Close ───────────────────────────────────────── */
  function openSearch() {
    searchOpen = true;
    const inSection = isInSection();
    $('search-input').placeholder = inSection ? 'Cerca nel testo…' : 'Cerca gioco…';
    $('search-controls').classList.toggle('visible', false);
    $('search-overlay').classList.add('visible');
    $('nav-search').classList.add('active');
    setTimeout(() => $('search-input').focus(), 80);
  }

  function closeSearch() {
    searchOpen = false;
    $('search-overlay').classList.remove('visible');
    $('search-controls').classList.remove('visible');
    $('nav-search').classList.remove('active');
    const inp = $('search-input');
    inp.value = '';
    inp.blur();
    if (isInSection()) {
      clearHighlights();
    } else {
      renderHomeList(gamesData);
    }
  }

  /* ── Event listeners ────────────────────────────────────── */
  $('nav-search').addEventListener('click', () => {
    searchOpen ? closeSearch() : openSearch();
  });

  $('search-close-btn').addEventListener('click', closeSearch);
  $('search-prev').addEventListener('click', searchPrev);
  $('search-next').addEventListener('click', searchNext);

  $('search-input').addEventListener('input', function () {
    const q = this.value.trim();
    if (isInSection()) {
      highlightInPage(q);
    } else {
      const ql = q.toLowerCase();
      renderHomeList(ql
        ? gamesData.filter(g =>
            g.title.toLowerCase().includes(ql) ||
            (g.subtitle || '').toLowerCase().includes(ql))
        : gamesData
      );
    }
  });

  /* ── Nav buttons ────────────────────────────────────────── */
  $('nav-home').addEventListener('click', () => {
    navHistory = ['home'];
    currentGame = null;
    resetTheme();
    closeSearch();
    history.replaceState({ pg: 'home' }, '');
    showView('home');
  });

  $('nav-back').addEventListener('click', () => {
    if (searchOpen) closeSearch();
    else            goBack();
  });

  /* ── Owned filter ───────────────────────────────────────── */
  ['all','mine','others'].forEach(val => {
    $(`filter-${val}`).addEventListener('click', () => {
      ownerFilter = val;
      ['all','mine','others'].forEach(v =>
        $(`filter-${v}`).classList.toggle('active', v === val)
      );
      renderHomeList(gamesData);
    });
  });

  /* ── Scroll to Top ──────────────────────────────────────── */
  const scrollBtn = $('scroll-top-btn');
  const SCROLL_THRESHOLD = 180;

  function updateScrollBtn() {
    const scrolled = window.pageYOffset
      || document.documentElement.scrollTop
      || document.body.scrollTop
      || 0;
    scrollBtn.classList.toggle('visible', scrolled > SCROLL_THRESHOLD);
  }

  // Ascolta su window e document per coprire tutti i browser
  window.addEventListener('scroll',   updateScrollBtn, { passive: true });
  document.addEventListener('scroll', updateScrollBtn, { passive: true });

  scrollBtn.addEventListener('click', () => {
    window.scrollTo({ top: 0, behavior: 'smooth' });
    document.documentElement.scrollTop = 0;
    document.body.scrollTop = 0;
    setTimeout(updateScrollBtn, 400);
  });

  /* ── iOS install hint ───────────────────────────────────── */
  const isIOS     = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const isStand   = window.matchMedia('(display-mode: standalone)').matches;
  const dismissed = sessionStorage.getItem('install-dismissed');
  if (isIOS && !isStand && !dismissed) {
    setTimeout(() => { $('install-banner').style.display = 'block'; }, 3500);
  }
  $('install-close').addEventListener('click', () => {
    $('install-banner').style.display = 'none';
    sessionStorage.setItem('install-dismissed', '1');
  });

  /* ── Service Worker ─────────────────────────────────────── */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(r => console.log('[PWA] SW registrato:', r.scope))
        .catch(e => console.warn('[PWA] SW fallito:', e));
    });
  }

  /* ── Bootstrap ──────────────────────────────────────────── */
  init();
  </script>
</body>
</html>
