<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#EE8860" id="meta-theme-color">
  <meta name="description" content="Riassunti strutturati dei tuoi giochi da tavolo preferiti">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Prepara &amp; Gioca">
  <title>Prepara &amp; Gioca</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet">

  <style>
    /* ── Reset & Root ─────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary:         #EE8860;
      --primary-mid:     #E07040;
      --primary-dark:    #C25A2A;
      --primary-light:   #F5AA88;
      --primary-pale:    #FDEEE5;
      --primary-ghost:   #FFF8F3;

      --bg:              #FFF8F3;
      --surface:         #FFFFFF;
      --surface-2:       #FFF3EC;

      --text:            #2A1A0E;
      --text-secondary:  #7A6050;
      --text-disabled:   #B8A898;

      --border:          #EDCFBC;
      --border-light:    #F5E5DA;

      --shadow-sm:  0 1px 4px rgba(180,80,30,0.08);
      --shadow-md:  0 4px 16px rgba(180,80,30,0.12);
      --shadow-lg:  0 8px 32px rgba(180,80,30,0.16);

      --radius:    16px;
      --radius-sm: 10px;
      --radius-xs:  6px;

      --nav-height:   60px;
      --safe-bottom:  env(safe-area-inset-bottom, 0px);
      --safe-top:     env(safe-area-inset-top, 0px);

      /* Pulsante scroll-to-top: 44px + 12px gap sopra la nav */
      --scroll-btn-size: 56px;

      /* Padding inferiore: nav + safe area + pulsante scroll-to-top + margine */
      --content-pb: calc(var(--nav-height) + var(--safe-bottom) + var(--scroll-btn-size) + 16px);

      /* Game theme – overridden dinamicamente per gioco */
      --game-color:       var(--primary);
      --game-color-mid:   var(--primary-mid);
      --game-color-pale:  var(--primary-pale);
    }

    html, body {
      min-height: 100%;
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ── View System ──────────────────────────────────────────── */
    .view {
      display: none;
      min-height: calc(100dvh - var(--nav-height) - var(--safe-bottom));
      animation: fadeUp .22s ease both;
    }
    .view.active { display: block; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Search Overlay ───────────────────────────────────────
       Scende dall'alto: il tastierino si apre dal basso →
       non si sovrappongono mai.
    ────────────────────────────────────────────────────────── */
    #search-overlay {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 300;
      background: linear-gradient(160deg, var(--primary) 0%, var(--primary-light) 100%);
      padding: calc(var(--safe-top) + 10px) 16px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: var(--shadow-lg);
      transform: translateY(-110%);
      transition: transform .26s cubic-bezier(0.34, 1.3, 0.64, 1);
      pointer-events: none;
    }
    #search-overlay.visible {
      transform: translateY(0);
      pointer-events: all;
    }

    .search-input-wrap {
      position: relative;
      flex: 1;
    }
    .search-input-wrap svg {
      position: absolute; left: 13px; top: 50%;
      transform: translateY(-50%);
      width: 17px; height: 17px;
      pointer-events: none; opacity: 0.65;
    }
    #search-input {
      width: 100%;
      padding: 11px 14px 11px 40px;
      background: rgba(255,255,255,0.22);
      border: 1.5px solid rgba(255,255,255,0.38);
      border-radius: 50px;
      font-size: 0.92rem;
      color: #fff;
      font-family: 'DM Sans', sans-serif;
      outline: none;
      transition: background .2s, border-color .2s;
      -webkit-appearance: none;
    }
    #search-input::placeholder { color: rgba(255,255,255,0.65); }
    #search-input:focus {
      background: rgba(255,255,255,0.32);
      border-color: rgba(255,255,255,0.7);
    }

    /* Controlli ricerca in-pagina (counter + frecce) — bianchi */
    .search-controls {
      display: none;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }
    .search-controls.visible { display: flex; }

    #search-counter {
      font-size: 0.78rem;
      font-weight: 600;
      color: rgba(255,255,255,0.9);
      min-width: 36px;
      text-align: center;
      font-family: 'DM Sans', sans-serif;
    }

    .search-nav-btn {
      background: rgba(255,255,255,0.18);
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      color: #fff;
      -webkit-tap-highlight-color: transparent;
      transition: background .15s;
      flex-shrink: 0;
    }
    .search-nav-btn:active { background: rgba(255,255,255,0.32); }
    .search-nav-btn svg { width: 16px; height: 16px; }

    /* Pulsante ✕ chiudi — bianco */
    #search-close-btn {
      background: rgba(255,255,255,0.18);
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      color: #fff;
      font-size: 0.9rem;
      -webkit-tap-highlight-color: transparent;
      transition: background .15s;
      flex-shrink: 0;
    }
    #search-close-btn:active { background: rgba(255,255,255,0.32); }

    /* Evidenziazione risultati nel testo */
    mark.search-hit {
      background: rgba(255, 220, 80, 0.55);
      color: inherit;
      border-radius: 2px;
      padding: 0 1px;
    }
    mark.search-hit.current {
      background: rgba(255, 180, 0, 0.85);
      color: #1a0e00;
    }

    /* ── Bottom Navigation ────────────────────────────────────── */
    #bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: calc(var(--nav-height) + var(--safe-bottom));
      padding-bottom: var(--safe-bottom);
      background: var(--surface);
      border-top: 1.5px solid var(--border-light);
      display: flex;
      z-index: 200;
      box-shadow: 0 -2px 16px rgba(180,80,30,0.08);
    }

    .nav-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      background: none;
      border: none;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.68rem;
      font-weight: 500;
      color: var(--text-disabled);
      padding: 8px 4px;
      -webkit-tap-highlight-color: transparent;
      transition: color .15s, transform .1s, opacity .2s;
      letter-spacing: 0.01em;
      user-select: none;
    }
    .nav-btn:active { transform: scale(0.93); }
    .nav-btn.active { color: var(--primary); }
    .nav-btn svg { width: 22px; height: 22px; }
    .nav-btn.active svg path, .nav-btn.active svg rect,
    .nav-btn.active svg circle, .nav-btn.active svg polyline,
    .nav-btn.active svg line { stroke: var(--primary); }

    /* Tasto Cerca: visibile solo sulla home */
    #nav-search { transition: color .15s, transform .1s, opacity .2s; }
    #nav-search.hidden {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.7);
    }

    /* ── HOME VIEW ────────────────────────────────────────────── */
    #view-home { background: var(--bg); }

    .home-header {
      background: linear-gradient(160deg, var(--primary) 0%, var(--primary-light) 100%);
      padding: calc(var(--safe-top) + 18px) 20px 18px;
    }
    .home-header-top {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header-logo {
      width: 38px; height: 38px;
      background: rgba(255,255,255,0.2);
      border-radius: 10px;
      padding: 5px;
      flex-shrink: 0;
    }
    .header-logo img { width: 100%; height: 100%; object-fit: contain; }

    /* FIX: h1 senza span — "Prepara &" e "Gioca" stesso colore/peso */
    .home-header h1 {
      font-family: 'Nunito', sans-serif;
      font-weight: 900;
      font-size: 1.5rem;
      color: #fff;
      letter-spacing: -0.3px;
      line-height: 1;
    }

    #games-count {
      font-size: 0.78rem;
      color: var(--text-secondary);
      padding: 12px 20px 4px;
      font-weight: 500;
      letter-spacing: 0.01em;
    }

    /* Bordo tratteggiato per giochi non posseduti */
    .game-card.not-owned {
      border: 1.5px dashed var(--border);
      opacity: 0.82;
    }
    .game-card.not-owned:active { border-color: var(--text-secondary); }

    /* Filtro owned nella games-count bar */
    #games-count-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px 4px;
    }
    #games-count {
      font-size: 0.78rem;
      color: var(--text-secondary);
      font-weight: 500;
      letter-spacing: 0.01em;
    }

    /* Tre pulsanti filtro ownership */
    .owned-filter {
      display: flex;
      gap: 2px;
      background: var(--surface-2);
      border-radius: 50px;
      padding: 2px;
      border: 1px solid var(--border-light);
    }
    .owned-filter-btn {
      width: 30px; height: 30px;
      border-radius: 50px;
      border: none;
      background: transparent;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      -webkit-tap-highlight-color: transparent;
      transition: background .15s;
    }
    .owned-filter-btn .filter-icon {
      display: inline-block;
      width: 16px; height: 16px;
      background-color: var(--text-secondary);
      -webkit-mask-size: contain; mask-size: contain;
      -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
      -webkit-mask-position: center; mask-position: center;
      transition: background-color .15s;
    }
    .owned-filter-btn.active { background: var(--primary); }
    .owned-filter-btn.active .filter-icon { background-color: #fff; }
    .owned-filter-btn:not(.active):active { background: var(--border-light); }

    /* FIX: padding-bottom sicuro per non finire sotto la nav */
    #games-list {
      padding: 8px 16px var(--content-pb);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Game Card */
    .game-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 12px;
      display: flex;
      gap: 13px;
      align-items: center;
      cursor: pointer;
      border: 1.5px solid var(--border-light);
      box-shadow: var(--shadow-sm);
      transition: transform .15s ease, box-shadow .15s ease, border-color .15s;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .game-card:active {
      transform: scale(0.982);
      box-shadow: none;
      border-color: var(--border);
    }
    .game-card-img-wrap {
      width: 76px; height: 76px;
      border-radius: var(--radius-sm);
      overflow: hidden;
      flex-shrink: 0;
      /* background impostato dinamicamente col themeColor del gioco */
      background: var(--surface-2);
      border: 1px solid var(--border-light);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.8rem;
      cursor: zoom-in;
    }
    .game-card-img-wrap img {
      width: 100%; height: 100%;
      object-fit: contain;   /* mostra l'intera cover senza ritagliare */
      display: block;
    }
    .game-card-body { flex: 1; min-width: 0; }
    .game-card-title {
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 1.0rem;
      color: var(--text);
      margin-bottom: 7px;
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .game-meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3px 6px;
    }
    .meta-pill {
      display: flex; align-items: center; gap: 5px;
      font-size: 0.77rem;
      color: var(--text-secondary);
      line-height: 1.2;
    }
    .meta-pill svg { width: 13px; height: 13px; flex-shrink: 0; opacity: 0.75; }
    .game-card-arrow {
      color: var(--border);
      flex-shrink: 0;
      font-size: 1.1rem;
      margin-left: 2px;
    }

    /* ── GAME MENU VIEW ───────────────────────────────────────── */
    #view-game-menu { background: var(--bg); }

    .copertina-wrap {
      width: 100%;
      height: 190px;
      overflow: hidden;
      position: relative;
      background: var(--game-color);
      display: flex; align-items: center; justify-content: center;
    }
    .copertina-wrap img {
      max-width: 100%; max-height: 100%;
      width: auto; height: auto;
      object-fit: contain;   /* immagine sempre intera, senza ritagli */
      display: block;
    }
    .copertina-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to bottom, transparent 40%, rgba(0,0,0,0.35) 100%);
    }

    .game-menu-header {
      background: var(--surface);
      padding: 14px 20px 16px;
      border-bottom: 1.5px solid var(--border-light);
    }
    /* FIX: rimossa l'etichetta "Gioco da Tavolo" — solo il titolo */
    #game-menu-title {
      font-family: 'Nunito', sans-serif;
      font-weight: 900;
      font-size: 1.5rem;
      color: var(--game-color);
      line-height: 1.15;
      letter-spacing: -0.3px;
    }
    .game-meta-strip {
      display: flex; gap: 12px;
      margin-top: 10px; flex-wrap: wrap;
    }
    .meta-chip {
      display: flex; align-items: center; gap: 5px;
      background: var(--game-color-pale);
      border: 1px solid color-mix(in srgb, var(--game-color) 25%, transparent);
      border-radius: 50px;
      padding: 4px 10px;
      font-size: 0.78rem;
      color: var(--game-color-mid);
      font-weight: 600;
    }
    .meta-chip svg { width: 13px; height: 13px; opacity: 0.8; }

    .sections-label {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--text-secondary);
      padding: 16px 20px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* FIX: padding-bottom sicuro */
    #sections-list {
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }
    /* Il padding inferiore va sul contenitore finale del menu gioco */
    #game-menu-content {
      padding-bottom: var(--content-pb);
    }

    .section-btn {
      background: var(--surface);
      border: 2px solid var(--game-color);
      border-radius: var(--radius);
      padding: 16px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      font-size: 1.05rem;
      color: var(--game-color);
      transition: all .15s ease;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      text-align: left;
      width: 100%;
      position: relative;
      overflow: hidden;
    }
    .section-btn::after {
      content: '';
      position: absolute; inset: 0;
      background: var(--game-color);
      opacity: 0;
      transition: opacity .15s;
    }
    .section-btn:active::after { opacity: 0.08; }
    .btn-icon {
      width: 28px; height: 28px;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
    }
    /* Nei pulsanti (sfondo bianco): icona nel colore del gioco via invert+sepia trick */
    .btn-icon img {
      width: 24px; height: 24px;
      object-fit: contain;
      filter: invert(1);      /* bianco → nero come base */
      mix-blend-mode: multiply; /* si moltiplica col bg bianco → resta visibile */
      opacity: 0.75;
    }
    .btn-label { flex: 1; }
    .btn-arrow { font-size: 0.9rem; opacity: 0.45; flex-shrink: 0; }

    /* ── SECTION DETAIL VIEW ──────────────────────────────────── */
    #view-section { background: #fff; }

    .section-hero {
      background: var(--game-color);
      padding: calc(var(--safe-top) + 16px) 20px 18px;
      position: relative;
    }
    .section-hero-inner { position: relative; z-index: 1; }
    .section-hero-game {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.75);
      margin-bottom: 4px;
    }
    .section-hero h2 {
      font-family: 'Nunito', sans-serif;
      font-weight: 900;
      font-size: 1.5rem;
      color: #fff;
      letter-spacing: -0.3px;
    }
    .section-hero-icon {
      position: absolute; right: 20px; top: 50%;
      transform: translateY(-50%);
      width: 56px; height: 56px;
      opacity: 0.22;
    }
    .section-hero-icon img {
      width: 100%; height: 100%;
      object-fit: contain;
      /* L'icona è bianca su trasparente: perfetta sull'header colorato */
    }

    /* FIX: padding-bottom sicuro anche nel markdown */
    #markdown-content, .md-body {
      padding: 22px 20px var(--content-pb);
      background: #fff;
      line-height: 1.72;
      font-size: 0.94rem;
    }
    #markdown-content, .md-body h1 {
      font-family: 'Nunito', sans-serif;
      font-weight: 800; font-size: 1.25rem;
      color: var(--game-color);
      margin: 1.4em 0 0.5em;
      line-height: 1.25;
      padding-bottom: 6px;
      border-bottom: 2px solid color-mix(in srgb, var(--game-color) 20%, transparent);
    }
    #markdown-content, .md-body h2 {
      font-family: 'Nunito', sans-serif;
      font-weight: 700; font-size: 1.1rem;
      color: var(--game-color);
      margin: 1.2em 0 0.45em;
      line-height: 1.3;
    }
    #markdown-content, .md-body h3 {
      font-family: 'Nunito', sans-serif;
      font-weight: 700; font-size: 0.98rem;
      color: var(--text);
      margin: 1em 0 0.35em;
    }
    #markdown-content, .md-body h1:first-child,
    #markdown-content, .md-body h2:first-child,
    #markdown-content, .md-body h3:first-child { margin-top: 0; }
    #markdown-content, .md-body p { margin: 0.55em 0; }
    #markdown-content, .md-body ul, #markdown-content, .md-body ol { margin: 0.5em 0 0.5em 1.3em; }
    #markdown-content, .md-body li { margin: 0.28em 0; }
    #markdown-content, .md-body li > ul, #markdown-content, .md-body li > ol { margin: 0.2em 0 0.2em 1.1em; }
    #markdown-content, .md-body strong { font-weight: 600; color: var(--text); }
    #markdown-content, .md-body em { color: var(--text-secondary); }

    /* accent sovrascrive le regole base di strong ed em */
    #markdown-content, .md-body .md-accent,
    #markdown-content, .md-body .md-accent p,
    #markdown-content, .md-body .md-accent li,
    #markdown-content, .md-body .md-accent h1,
    #markdown-content, .md-body .md-accent h2,
    #markdown-content, .md-body .md-accent h3,
    #markdown-content, .md-body .md-accent strong,
    #markdown-content, .md-body .md-accent b,
    #markdown-content, .md-body .md-accent em,
    #markdown-content, .md-body .md-accent i {
      color: var(--game-color);
    }
    /* Immagini standard nel markdown — cliccabili per lightbox */
    #markdown-content, .md-body img:not(.img-inline):not(.img-center):not(.img-icon) {
      max-width: 100%;
      border-radius: var(--radius-sm);
      margin: 1em 0;
      display: block;
      box-shadow: var(--shadow-md);
      cursor: zoom-in;
      transition: opacity .15s;
    }
    #markdown-content, .md-body img:not(.img-inline):not(.img-center):not(.img-icon):active {
      opacity: 0.85;
    }
    #markdown-content, .md-body img.img-center {
      display: block;
      max-width: 100%;
      margin: 1em auto;
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow-md);
      cursor: zoom-in;
      transition: opacity .15s;
    }
    #markdown-content, .md-body img.img-center:active { opacity: 0.85; }
    /* {inline} — icona in linea col testo, nessuna ombra */
    img.img-inline {
      display: inline-block;
      vertical-align: middle;
      height: 1.4em;
      width: auto;
      margin: 0 3px;
      box-shadow: none;
      border-radius: 2px;
      position: relative;
      top: -1px;
      cursor: zoom-in;
    }
    /* {.img-inline-lg} — wrapper span impedisce il line-break e schiacciamento */
    span.img-lg-wrap {
      display: inline-block;
      white-space: nowrap;
      vertical-align: middle;
      position: relative;
      top: -1px;
      margin: 0 3px;
      line-height: 0;
      cursor: zoom-in;
    }
    span.img-lg-wrap > img {
      height: 2.4em;
      min-height: 2.4em;
      width: auto;
      min-width: 2.4em;
      display: inline-block;
      vertical-align: middle;
      box-shadow: none;
      border-radius: 3px;
      object-fit: contain;
    }

    /* ── Lightbox ─────────────────────────────────────────────── */
    #lightbox {
      display: none;
      position: fixed; inset: 0;
      z-index: 500;
      background: rgba(0,0,0,0.88);
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 24px;
      cursor: zoom-out;
      animation: lbFadeIn .18s ease both;
    }
    #lightbox.open { display: flex; }
    @keyframes lbFadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    #lightbox img {
      max-width: 90vw;
      max-height: 85vh;
      width: auto; height: auto;
      border-radius: var(--radius);
      box-shadow: 0 8px 48px rgba(0,0,0,0.6);
      cursor: default;
      animation: lbZoomIn .2s cubic-bezier(0.34,1.3,0.64,1) both;
    }
    @keyframes lbZoomIn {
      from { transform: scale(0.88); }
      to   { transform: scale(1); }
    }
    #lightbox-close {
      position: absolute; top: 16px; right: 16px;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.22);
      color: #fff;
      border-radius: 50%;
      width: 36px; height: 36px;
      font-size: 1.1rem;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background .15s;
    }
    #lightbox-caption {
      color: rgba(255,255,255,0.75);
      font-size: 0.82rem;
      text-align: center;
      margin-top: 10px;
      max-width: 90vw;
      font-family: 'DM Sans', sans-serif;
    }
    #markdown-content, .md-body table {
      width: 100%; border-collapse: collapse;
      margin: 1em 0; font-size: 0.88rem;
      border-radius: var(--radius-sm);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }
    #markdown-content, .md-body th {
      background: var(--game-color);
      color: #fff; padding: 9px 12px;
      text-align: left;
      font-family: 'Nunito', sans-serif; font-weight: 700;
    }
    #markdown-content, .md-body td {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border-light);
      vertical-align: top;
    }
    #markdown-content, .md-body tr:last-child td { border-bottom: none; }
    #markdown-content, .md-body tr:nth-child(even) td { background: var(--surface-2); }
    #markdown-content, .md-body blockquote {
      border-left: 3px solid var(--game-color);
      padding: 8px 14px; margin: 0.8em 0;
      background: var(--game-color-pale);
      border-radius: 0 var(--radius-xs) var(--radius-xs) 0;
      font-style: italic; color: var(--text-secondary);
    }
    #markdown-content, .md-body code {
      background: var(--surface-2);
      border: 1px solid var(--border-light);
      padding: 2px 6px; border-radius: 4px;
      font-size: 0.86em; font-family: 'Courier New', monospace;
      color: var(--game-color-mid);
    }
    #markdown-content, .md-body pre {
      background: var(--surface-2);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-sm);
      padding: 14px 16px; overflow-x: auto; margin: 0.8em 0;
    }
    #markdown-content, .md-body pre code { background: none; border: none; padding: 0; font-size: 0.85rem; }
    #markdown-content, .md-body hr {
      border: none;
      border-top: 2px solid color-mix(in srgb, var(--game-color) 20%, transparent);
      margin: 1.4em 0;
    }

    /* ── Estensioni markdown-it ───────────────────────────────── */

    /* ── ::: spoiler — regola sbloccabile ────────────────────── */
    details.md-spoiler {
      margin: 0.8em 0;
      border-radius: var(--radius-sm);
      border: 1.5px solid color-mix(in srgb, var(--game-color) 35%, transparent);
      overflow: hidden;
    }
    details.md-spoiler summary.md-spoiler-summary {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      cursor: pointer;
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      font-size: 0.92rem;
      color: var(--game-color);
      background: color-mix(in srgb, var(--game-color) 8%, transparent);
      list-style: none;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      transition: background .15s;
    }
    details.md-spoiler summary.md-spoiler-summary::-webkit-details-marker { display: none; }
    details.md-spoiler summary.md-spoiler-summary:active {
      background: color-mix(in srgb, var(--game-color) 16%, transparent);
    }
    /* Icona lucchetto: chiuso di default, aperto quando espanso */
    details.md-spoiler summary.md-spoiler-summary::before {
      content: '';
      display: inline-block;
      width: 1.1em; height: 1.1em;
      flex-shrink: 0;
      background-color: var(--game-color);
      -webkit-mask-image: url(icons/padlock.png);
      mask-image: url(icons/padlock.png);
      -webkit-mask-size: contain; mask-size: contain;
      -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
      -webkit-mask-position: center; mask-position: center;
    }
    details.md-spoiler[open] summary.md-spoiler-summary::before {
      -webkit-mask-image: url(icons/padlock-open.png);
      mask-image: url(icons/padlock-open.png);
    }
    /* Freccia a destra che ruota all'apertura */
    details.md-spoiler summary.md-spoiler-summary::after {
      content: '›';
      margin-left: auto;
      font-size: 1.2rem;
      line-height: 1;
      color: var(--game-color);
      transition: transform .2s ease;
    }
    details.md-spoiler[open] summary.md-spoiler-summary::after {
      transform: rotate(90deg);
    }
    /* Corpo del contenuto */
    .md-spoiler-body {
      padding: 12px 16px;
      border-top: 1px solid color-mix(in srgb, var(--game-color) 20%, transparent);
    }
    .md-spoiler-body > *:first-child { margin-top: 0; }
    .md-spoiler-body > *:last-child  { margin-bottom: 0; }

    /* ::: indent — paragrafo/blocco indentato */
    .md-indent {
      margin-left: 1.4em;
      padding-left: 10px;
      border-left: 2px solid var(--game-color);
    }

    /* **testo**{.accent} — grassetto colorato inline nel colore del gioco */
    #markdown-content, .md-body .accent {
      color: var(--game-color);
      font-weight: 600;
    }

    /* ── Badge AI Summary ─────────────────────────────────────── */
    .ai-badge {
      position: absolute;
      top: 4px; right: 4px;
      font-size: 0.7rem;
      line-height: 1;
      background: rgba(0,0,0,0.45);
      color: #fff;
      border-radius: 50px;
      padding: 2px 5px;
      pointer-events: none;
      user-select: none;
      z-index: 2;
    }
    /* Badge inline nella sections-label */
    .ai-badge-title {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.7rem;
      font-family: 'DM Sans', sans-serif;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #fff;
      background: var(--game-color);
      border-radius: 50px;
      padding: 3px 8px;
      white-space: nowrap;
      text-transform: none;
    }
    .ai-badge-title img {
      width: 0.8rem;
      height: 0.8rem;
      object-fit: contain;
      filter: brightness(0) invert(1);
    }

    /* {.icon} — icona dalla cartella /icons/, colorata col colore del gioco */
    .img-icon {
      display: inline-block;
      width: 1.15em;
      height: 1.15em;
      background-color: var(--game-color);
      -webkit-mask-size: contain;
      -webkit-mask-repeat: no-repeat;
      -webkit-mask-position: center;
      mask-size: contain;
      mask-repeat: no-repeat;
      mask-position: center;
      vertical-align: middle;
      position: relative;
      top: -0.1em;
      margin: 0 3px;
      flex-shrink: 0;
    }

    /* ── Termine cliccabile {.def} ───────────────────────────── */
    #markdown-content, .md-body .def {
      color: var(--game-color);
      text-decoration: underline;
      text-decoration-style: dotted;
      text-underline-offset: 3px;
      cursor: pointer;
      font-weight: inherit;
      transition: opacity .15s;
    }
    #markdown-content, .md-body .def:active { opacity: 0.65; }

    /* ── Popup definizione ────────────────────────────────────── */
    #def-popup {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 600;
      align-items: flex-end;    /* sale dal basso su mobile */
      justify-content: center;
      padding: 0;
    }
    #def-popup.open { display: flex; }

    #def-popup-backdrop {
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.45);
      animation: fadeIn .2s ease both;
    }
    @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }

    #def-popup-box {
      position: relative;
      z-index: 1;
      background: var(--surface);
      width: 100%;
      max-width: 560px;
      max-height: 72vh;
      border-radius: var(--radius) var(--radius) 0 0;
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      animation: slideUp .25s cubic-bezier(0.34,1.2,0.64,1) both;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to   { transform: translateY(0); }
    }

    #def-popup-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px 10px;
      border-bottom: 1.5px solid var(--border-light);
      flex-shrink: 0;
    }
    #def-popup-term {
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 1.05rem;
      color: var(--game-color);
      letter-spacing: -0.2px;
    }
    /* Maniglietta drag in cima */
    #def-popup-box::before {
      content: '';
      display: block;
      width: 36px; height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin: 10px auto 0;
      flex-shrink: 0;
    }
    #def-popup-close {
      background: var(--surface-2);
      border: 1px solid var(--border-light);
      color: var(--text-secondary);
      border-radius: 50%;
      width: 30px; height: 30px;
      font-size: 0.9rem;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      flex-shrink: 0;
    }
    #def-popup-close:active { background: var(--border-light); }

    #def-popup-content {
      overflow-y: auto;
      padding: 14px 18px calc(var(--safe-bottom) + 18px);
      font-size: 0.91rem;
      line-height: 1.65;
      color: var(--text);
    }
    /* Il contenuto del popup usa gli stessi stili markdown della sezione */
    #def-popup-content h1 { font-family:'Nunito',sans-serif; font-weight:800;
      font-size:1.1rem; color:var(--game-color); margin:.8em 0 .3em;
      border-bottom:1.5px solid color-mix(in srgb,var(--game-color) 20%,transparent);
      padding-bottom:4px; }
    #def-popup-content h2 { font-family:'Nunito',sans-serif; font-weight:700;
      font-size:.97rem; color:var(--game-color); margin:.7em 0 .3em; }
    #def-popup-content strong { font-weight:600; color:var(--text); }
    #def-popup-content em { color:var(--text-secondary); }
    #def-popup-content ul, #def-popup-content ol { margin:.4em 0 .4em 1.2em; }
    #def-popup-content li { margin:.2em 0; }
    #def-popup-content img:not(.img-inline) { max-width:100%; border-radius:var(--radius-sm);
      margin:.7em 0; display:block; box-shadow:var(--shadow-md); }
    #def-popup-content img.img-inline { display:inline-block; vertical-align:middle;
      height:1.4em; width:auto; margin:0 3px; box-shadow:none; position:relative; top:-1px; }
    #def-popup-content table { width:100%; border-collapse:collapse; margin:.6em 0;
      font-size:.85rem; }
    #def-popup-content th { background:var(--game-color); color:#fff; padding:6px 10px;
      font-family:'Nunito',sans-serif; font-weight:700; text-align:left; }
    #def-popup-content td { padding:6px 10px; border-bottom:1px solid var(--border-light); }
    #def-popup-content blockquote { border-left:3px solid var(--game-color);
      padding:6px 10px; margin:.5em 0; background:var(--primary-pale);
      border-radius:0 var(--radius-xs) var(--radius-xs) 0;
      font-style:italic; color:var(--text-secondary); }

    /* ── Shared States ────────────────────────────────────────── */
    .loading-state {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 60px 20px; gap: 16px;
      color: var(--text-secondary);
    }
    .spinner {
      width: 34px; height: 34px;
      border: 3px solid var(--primary-pale);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin .75s linear infinite;
    }
    .loading-state p { font-size: 0.9rem; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .empty-state { text-align: center; padding: 64px 24px; color: var(--text-secondary); }
    .empty-state .empty-icon { font-size: 3.2rem; margin-bottom: 14px; }
    .empty-state p { font-size: 0.95rem; line-height: 1.5; }

    /* ── Pulsante Scroll to Top ───────────────────────────────── */
    #scroll-top-btn {
      position: fixed;
      right: 16px;
      bottom: calc(var(--nav-height) + var(--safe-bottom) + 12px);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--game-color, var(--primary));
      color: #fff;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-md);
      z-index: 190;
      opacity: 0;
      pointer-events: none;
      transform: scale(0.7) translateY(8px);
      transition: opacity .22s ease, transform .22s ease;
      -webkit-tap-highlight-color: transparent;
    }
    #scroll-top-btn.visible {
      opacity: 1;
      pointer-events: all;
      transform: scale(1) translateY(0);
    }
    #scroll-top-btn:active {
      transform: scale(0.92);
    }
    #scroll-top-btn svg {
      width: 20px; height: 20px;
    }

    /* ── Factions list view ───────────────────────────────── */
    #view-factions-list { background: #fff; }

    /* ── Aiuto al Giocatore ──────────────────────────────── */
    #view-aid {
      background: #fff;
      display: none;
      flex-direction: column;
      height: calc(100dvh - var(--nav-height) - var(--safe-bottom));
      overflow: hidden;
    }
    #view-aid.active { display: flex; }

    .aid-header {
      flex-shrink: 0;
      background: var(--surface);
      box-shadow: 0 1px 0 var(--border-light);
      z-index: 10;
    }
    .aid-header .section-hero { margin-bottom: 0 !important; }

    /* Tab bar */
    .aid-tab-bar {
      display: flex;
      border-top: 1px solid var(--border-light);
    }
    .aid-tab {
      flex: 1;
      padding: 10px 4px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--text-secondary);
      background: transparent;
      border: none;
      border-bottom: 2.5px solid transparent;
      cursor: pointer;
      transition: color .15s, border-color .15s;
      -webkit-tap-highlight-color: transparent;
    }
    .aid-tab.active {
      color: var(--game-color);
      border-bottom-color: var(--game-color);
    }

    /* Carousel panels */
    .aid-content-wrap {
      flex: 1;
      overflow: hidden;
      position: relative;
    }
    .aid-panels {
      display: flex;
      height: 100%;
      transition: transform .3s cubic-bezier(0.4, 0, 0.2, 1);
      will-change: transform;
    }
    .aid-panel {
      flex-shrink: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 0;
      height: 100%;
      box-sizing: border-box;
    }
    .aid-panel .md-body {
      padding: 16px 16px var(--content-pb);
    }
    /* Tabelle nelle aid panel — overflow orizzontale contenuto */
    .aid-panel .md-body table {
      display: block;
      overflow-x: auto;
      max-width: 100%;
      -webkit-overflow-scrolling: touch;
    }

    #factions-list {
      padding: 16px 16px var(--content-pb);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Pulsante fazione — simile a section-btn ma con foto/icona custom */
    .faction-btn {
      background: var(--surface);
      border: 2px solid var(--game-color);
      border-radius: var(--radius);
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      font-size: 1.0rem;
      color: var(--game-color);
      transition: all .15s ease;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      text-align: left;
      width: 100%;
      position: relative;
      overflow: hidden;
    }
    .faction-btn::after {
      content: ''; position: absolute; inset: 0;
      background: var(--game-color); opacity: 0; transition: opacity .15s;
    }
    .faction-btn:active::after { opacity: 0.08; }

    /* Icona/immagine fazione — quadrata, bordo arrotondato */
    .faction-btn-img {
      width: 40px; height: 40px;
      border-radius: var(--radius-sm);
      object-fit: contain;
      flex-shrink: 0;
      background: color-mix(in srgb, var(--game-color) 12%, transparent);
    }
    /* Fallback: icona generica via mask-image se non c'è foto */
    .faction-btn-icon-fallback {
      width: 40px; height: 40px;
      border-radius: var(--radius-sm);
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      background: color-mix(in srgb, var(--game-color) 10%, transparent);
    }
    .faction-btn-icon-fallback span {
      width: 24px; height: 24px;
      display: inline-block;
      background-color: var(--game-color);
      -webkit-mask-image: url(icons/factions.png);
      mask-image: url(icons/factions.png);
      -webkit-mask-size: contain; mask-size: contain;
      -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
      -webkit-mask-position: center; mask-position: center;
    }
    .faction-btn-label { flex: 1; }
    .faction-btn-arrow { font-size: 0.9rem; opacity: 0.45; flex-shrink: 0; }

    /* Label "Fazioni" nel menu gioco */
    .factions-label {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--text-secondary);
      padding: 14px 20px 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .factions-label-icon {
      width: 14px; height: 14px;
      display: inline-block;
      background-color: var(--text-secondary);
      -webkit-mask-image: url(icons/factions.png);
      mask-image: url(icons/factions.png);
      -webkit-mask-size: contain; mask-size: contain;
      -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
    }

    /* ── Install banner (iOS) ─────────────────────────────────── */
    #install-banner {
      display: none;
      position: fixed; bottom: calc(var(--nav-height) + var(--safe-bottom) + 10px);
      left: 16px; right: 16px;
      background: var(--text); color: #fff;
      border-radius: var(--radius);
      padding: 12px 16px; font-size: 0.82rem; line-height: 1.5;
      box-shadow: var(--shadow-lg); z-index: 150;
    }
    #install-banner strong { display: block; margin-bottom: 3px; font-family: 'Nunito', sans-serif; }
    #install-close {
      position: absolute; top: 10px; right: 12px;
      background: none; border: none; color: rgba(255,255,255,0.7);
      font-size: 1.1rem; cursor: pointer; padding: 2px 4px;
    }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 50px; }
  </style>
</head>

<body>

  <!-- ══════════════════════════════════════════════════════════
       POPUP DEFINIZIONE — aperto cliccando su termini {.def}
  ══════════════════════════════════════════════════════════ -->
  <div id="def-popup" role="dialog" aria-modal="true" aria-labelledby="def-popup-term">
    <div id="def-popup-backdrop"></div>
    <div id="def-popup-box">
      <div id="def-popup-header">
        <span id="def-popup-term"></span>
        <button id="def-popup-close" aria-label="Chiudi">✕</button>
      </div>
      <div id="def-popup-content"></div>
    </div>
  </div>

  <!-- ══════════════════════════════════════════════════════════
       LIGHTBOX — cover-big.png a tutto schermo
  ══════════════════════════════════════════════════════════ -->
  <div id="lightbox" role="dialog" aria-modal="true" aria-label="Cover ingrandita">
    <button id="lightbox-close" aria-label="Chiudi">✕</button>
    <img id="lightbox-img" src="" alt="">
    <div id="lightbox-caption"></div>
  </div>

  <!-- ══════════════════════════════════════════════════════════
       SEARCH OVERLAY — scende dall'alto quando attivata
       Il tastierino si apre dal basso: non si sovrappongono.
  ══════════════════════════════════════════════════════════ -->
  <div id="search-overlay" role="search" aria-label="Cerca">
    <div class="search-input-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="search" id="search-input" placeholder="Cerca…"
             autocomplete="off" autocorrect="off" spellcheck="false">
    </div>
    <!-- Controlli in-pagina: visibili solo nelle sezioni -->
    <div class="search-controls" id="search-controls">
      <span id="search-counter">0/0</span>
      <button class="search-nav-btn" id="search-prev" aria-label="Precedente">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="18,15 12,9 6,15"/>
        </svg>
      </button>
      <button class="search-nav-btn" id="search-next" aria-label="Successivo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6,9 12,15 18,9"/>
        </svg>
      </button>
    </div>
    <button id="search-close-btn" aria-label="Chiudi">✕</button>
  </div>

  <!-- ════════════════════════════════════════════════════════ -->
  <!-- HOME VIEW                                               -->
  <!-- ════════════════════════════════════════════════════════ -->
  <div id="view-home" class="view active">
    <header class="home-header">
      <div class="home-header-top">
        <div class="header-logo">
          <img src="icon.png" alt="logo">
        </div>
        <!-- FIX: nessuno span, colore uniforme -->
        <h1>Prepara &amp; Gioca</h1>
      </div>
    </header>
    <div id="games-count-row">
      <div id="games-count"></div>
      <div class="owned-filter" role="group" aria-label="Filtro collezione">
        <button class="owned-filter-btn active" id="filter-all"
                aria-label="Tutti i giochi" title="Tutti">
          <span class="filter-icon" style="-webkit-mask-image:url(icons/owned-all.png);mask-image:url(icons/owned-all.png)"></span>
        </button>
        <button class="owned-filter-btn" id="filter-mine"
                aria-label="Solo i miei giochi" title="I miei">
          <span class="filter-icon" style="-webkit-mask-image:url(icons/owned-mine.png);mask-image:url(icons/owned-mine.png)"></span>
        </button>
        <button class="owned-filter-btn" id="filter-others"
                aria-label="Giochi degli amici" title="Degli amici">
          <span class="filter-icon" style="-webkit-mask-image:url(icons/owned-others.png);mask-image:url(icons/owned-others.png)"></span>
        </button>
      </div>
    </div>
    <div id="games-list">
      <div class="loading-state">
        <div class="spinner"></div>
        <p>Caricamento giochi…</p>
      </div>
    </div>
  </div>

  <!-- ════════════════════════════════════════════════════════ -->
  <!-- GAME MENU VIEW                                          -->
  <!-- ════════════════════════════════════════════════════════ -->
  <div id="view-game-menu" class="view">
    <div class="copertina-wrap" id="copertina-wrap">
      <img id="game-copertina" src="" alt="" style="display:none">
      <div class="copertina-overlay"></div>
    </div>
    <!-- FIX: rimossa etichetta "Gioco da Tavolo" -->
    <div class="game-menu-header">
      <div id="game-menu-title">Titolo</div>
      <div class="game-meta-strip" id="game-meta-strip"></div>
    </div>
    <div id="game-menu-content">
      <div class="sections-label" id="sections-label-wrap">Sezioni del Regolamento</div>
      <div id="sections-list"></div>
      <div id="factions-menu-block" style="display:none; margin-top:8px;">
        <div style="padding: 0 16px; display:flex; flex-direction:column; gap:9px;">
          <button class="section-btn" onclick="openFactionsList()">
            <span class="btn-icon">
              <img src="icons/factions.png" alt="Fazioni">
            </span>
            <span class="btn-label">Fazioni</span>
            <span class="btn-arrow">›</span>
          </button>
        </div>
      </div>
      <div id="aid-menu-block" style="display:none; margin-top:8px;">
        <div style="padding: 0 16px; display:flex; flex-direction:column; gap:9px;">
          <button class="section-btn" onclick="openAid()">
            <span class="btn-icon">
              <img src="icons/aid.png" alt="Aiuto al Giocatore">
            </span>
            <span class="btn-label">Aiuto al Giocatore</span>
            <span class="btn-arrow">›</span>
          </button>
        </div>

    </div>
  </div>

  <!-- ════════════════════════════════════════════════════════ -->
  <!-- SECTION DETAIL VIEW                                     -->
  <!-- ════════════════════════════════════════════════════════ -->
  <div id="view-section" class="view">
    <div class="section-hero" id="section-hero">
      <div class="section-hero-inner">
        <div class="section-hero-game" id="section-hero-game">Gioco</div>
        <h2 id="section-hero-title">Sezione</h2>
      </div>
      <div class="section-hero-icon" id="section-hero-icon"></div>

    <div id="markdown-content" class="md-body"></div>

  <!-- ════════════════════════════════════════════════════════ -->
  <!-- FACTIONS LIST VIEW                                      -->
  <!-- ════════════════════════════════════════════════════════ -->
  <div id="view-factions-list" class="view">
    <div class="section-hero" id="factions-hero">
      <div class="section-hero-inner">
        <div class="section-hero-game" id="factions-hero-game">Gioco</div>
        <h2 id="factions-hero-title">Fazioni</h2>
      </div>
      <div class="section-hero-icon" id="factions-hero-icon"></div>

    <div id="factions-list"></div>

  <!-- ════════════════════════════════════════════════════════ -->
  <!-- ════════════════════════════════════════════════════════ -->
  <!-- ════════════════════════════════════════════════════════ -->
  <!-- AID VIEW — Aiuto al Giocatore (tab + swipe)            -->
  <!-- ════════════════════════════════════════════════════════ -->
  <div id="view-aid" class="view">
    <div class="aid-header">
      <div class="section-hero" id="aid-hero" style="margin-bottom:0">
        <div class="section-hero-inner">
          <div class="section-hero-game" id="aid-hero-game"></div>
          <h2 id="aid-hero-title">Aiuto al Giocatore</h2>

        <div class="section-hero-icon" id="aid-hero-icon"></div>

  <button id="scroll-top-btn" aria-label="Torna su">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="18,15 12,9 6,15"/>
